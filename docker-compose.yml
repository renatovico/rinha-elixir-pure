x-api: &api
  image: renatoelias/rinha-elixir-pure:final
  environment:
    READY_FILE: /tmp/ready
    ERL_CRASH_DUMP_SECONDS: "0"
    HTTP_ACCEPTORS: "32"
    HTTP_MAX_CONNECTIONS: "8192"
    TELEMETRY_LOG_INTERVAL_MS: "10000"
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ready"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 5s
  networks:
    - net

services:
  api1:
    <<: *api
    container_name: rinha_pure_api1
    hostname: api1
    environment:
      READY_FILE: /tmp/ready
      ERL_CRASH_DUMP_SECONDS: "0"
      HTTP_ACCEPTORS: "32"
      HTTP_MAX_CONNECTIONS: "8192"
      PORT: "4000"
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          # Rinha 2026 budget: 1.0 CPU + 350 MB total.
          # api1 = 0.45 CPU / 125 MB, api2 = 0.45 / 125, lb = 0.10 / 100
          # → 1.00 CPU / 350 MB.
          cpus: "0.45"
          memory: "125M"

  api2:
    <<: *api
    container_name: rinha_pure_api2
    hostname: api2
    environment:
      READY_FILE: /tmp/ready
      ERL_CRASH_DUMP_SECONDS: "0"
      HTTP_ACCEPTORS: "32"
      HTTP_MAX_CONNECTIONS: "8192"
      PORT: "4000"
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "125M"

  haproxy:
    image: haproxy:lts-alpine
    container_name: rinha_pure_haproxy
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    cpuset: "0,2"
    command:
      ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
    networks:
      - net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "100M"

networks:
  net:
    driver: bridge
