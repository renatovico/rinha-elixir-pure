x-api: &api
  build: .
  image: renatoelias/rinha-elixir-pure:latest
  environment:
    READY_FILE: /tmp/ready
    ERL_CRASH_DUMP_SECONDS: "0"
    HTTP_ACCEPTORS: "32"
    HTTP_MAX_CONNECTIONS: "8192"
    TELEMETRY_LOG_INTERVAL_MS: "10000"
    RELEASE_DISTRIBUTION: sname
    RELEASE_COOKIE: rinha-secret-cookie
  healthcheck:
    test: ["CMD-SHELL", "test -f /tmp/ready"]
    interval: 2s
    timeout: 2s
    retries: 60
    start_period: 5s
  networks:
    - net

services:
  api1:
    <<: *api
    container_name: rinha_pure_api1
    hostname: api1
    environment:
      READY_FILE: /tmp/ready
      ERL_CRASH_DUMP_SECONDS: "0"
      HTTP_ACCEPTORS: "32"
      HTTP_MAX_CONNECTIONS: "8192"
      PORT: "4000"
      KNN_PROBES: "${KNN_PROBES:-12}"
      KNN_DYNAMIC_PROBES: "${KNN_DYNAMIC_PROBES:-true}"
      KNN_DYNAMIC_PROBES_MIN: "${KNN_DYNAMIC_PROBES_MIN:-3}"
      KNN_DYNAMIC_RUNQ_MID: "${KNN_DYNAMIC_RUNQ_MID:-1}"
      KNN_DYNAMIC_RUNQ_HIGH: "${KNN_DYNAMIC_RUNQ_HIGH:-2}"
      N3_BORDERLINE_CALIBRATION: "${N3_BORDERLINE_CALIBRATION:-true}"
      RELEASE_DISTRIBUTION: sname
      RELEASE_NODE: api1
      RELEASE_COOKIE: rinha-secret-cookie
      RINHA_PEER_NODE: api2@api2
    cpuset: "0,1"
    deploy:
      resources:
        limits:
          # Rinha 2026 budget: 1.0 CPU + 350 MB total.
          # api1 = 0.45 CPU / 125 MB, api2 = 0.45 / 125, lb = 0.10 / 100
          # → 1.00 CPU / 350 MB.
          cpus: "0.45"
          memory: "125M"

  api2:
    <<: *api
    container_name: rinha_pure_api2
    hostname: api2
    environment:
      READY_FILE: /tmp/ready
      ERL_CRASH_DUMP_SECONDS: "0"
      HTTP_ACCEPTORS: "32"
      HTTP_MAX_CONNECTIONS: "8192"
      PORT: "4000"
      KNN_PROBES: "${KNN_PROBES:-12}"
      KNN_DYNAMIC_PROBES: "${KNN_DYNAMIC_PROBES:-true}"
      KNN_DYNAMIC_PROBES_MIN: "${KNN_DYNAMIC_PROBES_MIN:-3}"
      KNN_DYNAMIC_RUNQ_MID: "${KNN_DYNAMIC_RUNQ_MID:-1}"
      KNN_DYNAMIC_RUNQ_HIGH: "${KNN_DYNAMIC_RUNQ_HIGH:-2}"
      N3_BORDERLINE_CALIBRATION: "${N3_BORDERLINE_CALIBRATION:-true}"
      RELEASE_DISTRIBUTION: sname
      RELEASE_NODE: api2
      RELEASE_COOKIE: rinha-secret-cookie
      RINHA_PEER_NODE: api1@api1
    cpuset: "2,3"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "125M"

  lb:
    <<: *api
    container_name: rinha_pure_lb
    hostname: lb
    ports:
      - "9999:9999"
    environment:
      RINHA_MODE: lb
      READY_FILE: /tmp/ready
      ERL_CRASH_DUMP_SECONDS: "0"
      LB_RPC_TIMEOUT_MS: "120"
      LB_RPC_RETRY_TIMEOUT_MS: "120"
      RELEASE_DISTRIBUTION: sname
      RELEASE_NODE: lb
      RELEASE_COOKIE: rinha-secret-cookie
      LB_PORT: "9999"
      LB_ACCEPTORS: "16"
      LB_PEER_NODES: api1@api1,api2@api2
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    cpuset: "0,2"
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "100M"

networks:
  net:
    driver: bridge
